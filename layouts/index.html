{{ define "main" }}
<section class="intro">
  {{ .Content }}
</section>
{{ $posts := (site.GetPage "/posts").Pages }}
{{ with first 5 $posts }}
<section>
  <h2>Recent posts</h2>
  <ul class="page-list">
    {{ range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></li>
    {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
