<form class="calc" id="mad-calc" novalidate>
  <div class="row">
    <label for="mad-lambda">Electron–phonon coupling λ</label>
    <input id="mad-lambda" type="number" step="any" min="0" value="1.0" inputmode="decimal" required>
  </div>
  <div class="row">
    <label for="mad-mu">Coulomb pseudopotential μ*</label>
    <input id="mad-mu" type="number" step="any" min="0" value="0.10" inputmode="decimal" required>
    <span class="hint">Typically 0.10–0.15.</span>
  </div>
  <div class="row">
    <label for="mad-omega">Logarithmic average phonon frequency ω<sub>log</sub></label>
    <div class="with-unit">
      <input id="mad-omega" type="number" step="any" min="0" value="300" inputmode="decimal" required>
      <select id="mad-unit" aria-label="Unit of ω_log">
        <option value="1">K</option>
        <option value="11.604518">meV</option>
        <option value="1.4387769">cm⁻¹</option>
        <option value="47.992431">THz</option>
      </select>
    </div>
  </div>
  <output id="mad-result" for="mad-lambda mad-mu mad-omega mad-unit" aria-live="polite"></output>
</form>

<script src="{{ "js/mcmillan.js" | relURL }}" defer></script>
